{% extends "base.html" %}
{% block sarlavha %}{{ t.admin_panel }}{% endblock %}

{% block kontent %}
<section class="bolim">
  <div class="kirish-konteyner">
    <div class="kirish-karta">
      <h1 style="font-size: 1.5rem">{{ t.admin_panel }}</h1>
      <p class="kichik">{{ konf.qisqa_nom }}</p>

      <form method="post" class="forma" style="margin-top: 1.5rem">
        <div class="maydon-guruh">
          <label for="login">Login</label>
          <input type="text" id="login" name="login" required autofocus>
        </div>
        <div class="maydon-guruh">
          <label for="parol">Parol</label>
          <input type="password" id="parol" name="parol" required>
        </div>
        <button type="submit" class="tugma tugma--asosiy tugma--keng">Kirish</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
